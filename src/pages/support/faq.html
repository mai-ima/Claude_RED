<!--META {"title": "よくあるご質問(FAQ)", "desc": "SUZAKU製品・購入・修理・保証に関するよくあるご質問。カテゴリ絞り込みとキーワード検索に対応。", "theme": "light", "crumbs": [["サポート", "/support/"], ["よくあるご質問", null]], "group": "サポート"} -->

<section class="hero hero--page">
  <div class="hero__inner hero-enter" style="width:100%">
    <p class="eyebrow">FAQ</p>
    <h1 class="t-h1">よくあるご質問</h1>
    <div class="searchbar" style="max-width:680px;width:100%">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input class="input" type="search" id="faqSearch" placeholder="キーワードで絞り込み(例: 防水、分割払い)" autocomplete="off" aria-label="FAQ検索">
    </div>
  </div>
</section>

<section class="section--sm section--flush-top" style="padding-top:var(--sp-5)">
  <div class="container container--narrow">
    <div class="spread" style="margin-bottom:20px">
      <div class="tabs" id="faqTabs"></div>
      <span class="t-small t-faint" id="faqCount"></span>
    </div>
    <div id="faqList" aria-live="polite"></div>
    <div class="card t-center" style="margin-top:48px;padding:clamp(28px,4vw,44px)">
      <h2 class="t-h4">解決しませんでしたか?</h2>
      <p class="t-small t-soft">サポートチームが直接お答えします。</p>
      <div class="cluster cluster--center" style="margin-top:10px">
        <a class="btn btn--primary" href="/support/contact/">お問い合わせ</a>
        <a class="btn btn--ghost" href="/support/repair/">修理のお申し込み</a>
      </div>
    </div>
  </div>
</section>
